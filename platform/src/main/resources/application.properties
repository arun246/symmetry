spring.application.name=platform

# Database (PostgreSQL). Tests use Testcontainers; see PlatformApplicationTests.
spring.datasource.url=${SYMMETRY_DB_URL:jdbc:postgresql://localhost:5432/symmetry}
spring.datasource.username=${SYMMETRY_DB_USER:symmetry}
spring.datasource.password=${SYMMETRY_DB_PASSWORD:symmetry}

# Schema is owned by Flyway migrations (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Security is OFF for local development. Turn it on (and set the issuer) once
# Keycloak is wired up:
#   SYMMETRY_SECURITY_ENABLED=true
#   spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/symmetry
symmetry.security.enabled=${SYMMETRY_SECURITY_ENABLED:false}

# Agreements a worker must accept before a submission counts (M1b).
symmetry.acceptance.required-agreements=${SYMMETRY_REQUIRED_AGREEMENTS:honesty,scope,ai-declaration,confidentiality,responsibility,license}

# Runner registration is disabled until an operator sets a shared secret. Each
# runner gets a one-time bearer token; results are also Ed25519-signed.
symmetry.runner.registration-token=${SYMMETRY_RUNNER_REGISTRATION_TOKEN:}
symmetry.runner.lease-seconds=${SYMMETRY_RUNNER_LEASE_SECONDS:600}

management.endpoints.web.exposure.include=health,info

# Stub exercises: agreements a worker must accept, and the first supported language.
symmetry.exercise.required-agreements=${SYMMETRY_EXERCISE_REQUIRED_AGREEMENTS:rights,confidentiality,ai-declaration,responsibility,license}
